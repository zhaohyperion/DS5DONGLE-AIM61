[package]
name = "ds5dongle-flasher"
version = "1.3.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Windows GUI and CLI flasher for DS5DONGLE-AIM61"
repository = "https://github.com/zhaohyperion/DS5DONGLE-AIM61"
build = "build.rs"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
crc32fast = "1.5.0"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
hex = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
windows-sys = { version = "0.61.2", features = ["Win32_Globalization"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.5", default-features = false, features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
